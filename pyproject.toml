[project]
name = "agent-shape"
version = "0.1.0"
description = "Crash-safety testing for AI agents: inject faults and real crashes at tool side effects, check invariants, shrink failures"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
keywords = ["agents", "testing", "fault-injection", "idempotency", "simulation", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/lutefd/shape"
Source = "https://github.com/lutefd/shape"
Issues = "https://github.com/lutefd/shape/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
langgraph = ["langgraph>=1.0", "langgraph-checkpoint-sqlite>=3.0"]
agents = ["openai-agents>=0.20"]

[project.scripts]
shape = "shape.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shape"]

[tool.hatch.build.targets.sdist]
include = ["/src/shape", "/tests", "/README.md", "/LICENSE", "/docs/adapters.md", "/docs/boundary.md", "/docs/design.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
