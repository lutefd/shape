name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check
      - run: pytest -q
      - name: toy saga must fail and shrink
        run: |
          set +e
          shape run --seeds 2000 --saga toy | tee toy.out
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -ne 0
          grep -q "invariant=at_most_once_effect" toy.out
      - name: fixed saga must pass
        run: shape run --seeds 2000 --saga fixed
      - name: plain-python example must fail and shrink
        run: |
          set +e
          shape test examples/plain_python/checks.py::checkout_buggy --seeds 200 | tee plain.out
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -ne 0
          grep -q "invariant=at_most_once(payments.charge)" plain.out
      - name: plain-python fixed example must pass
        run: shape test examples/plain_python/checks.py::checkout_fixed --seeds 200
      - name: README quickstart and guide docs check
        run: python scripts/check_docs.py
