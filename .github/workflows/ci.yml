name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]' httpx -r examples/net/requirements.txt
      - run: ruff check
      - run: pytest -q
      - name: toy saga must fail and shrink
        run: |
          set +e
          shape run --seeds 2000 --saga toy | tee toy.out
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -ne 0
          grep -q "invariant=at_most_once_effect" toy.out
      - name: fixed saga must pass
        run: shape run --seeds 2000 --saga fixed
      - name: plain-python example must fail and shrink
        run: |
          set +e
          shape test examples/plain_python/checks.py::checkout_buggy --seeds 200 | tee plain.out
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -ne 0
          grep -q "invariant=at_most_once(payments.charge)" plain.out
      - name: plain-python fixed example must pass
        run: shape test examples/plain_python/checks.py::checkout_fixed --seeds 200
      - name: README quickstart and guide docs check
        run: python scripts/check_docs.py
      - name: Mailtrap SDK example must find the false failure report
        run: |
          code=0
          shape test examples/net/mailtrap.py::mailtrap_reports_last_result +            --start 931 --seeds 1 > mailtrap.out || code=$?
          cat mailtrap.out
          test "$code" -eq 1
          grep -q 'invariant=claims_true' mailtrap.out
          grep -q '2 of 2 deviations kept' mailtrap.out
          grep -q 'caller saw HTTP 503' mailtrap.out
      - name: race examples must fail, shrink, replay and pass with the fix
        run: |
          for case in lead_summary:summary:every_stored_lead_appears_in_a_summary job_claim:queue:job_processed_once; do
            IFS=: read -r example scenario invariant <<< "$case"
            path="examples/races/$example.py"
            code=0
            shape test "$path::${scenario}_buggy" --seeds 100 > race.out || code=$?
            cat race.out
            test "$code" -eq 1
            grep -q "invariant=$invariant" race.out
            grep -q '1 of [0-9]* deviations kept' race.out
            grep -q 'scheduler ran' race.out
            replay=$(sed -n 's/^  replay: //p' race.out | head -n 1)
            code=0
            shape test "$path::${scenario}_buggy" --replay "$replay" > replay.out || code=$?
            cat replay.out
            test "$code" -eq 1
            grep -q "invariant=$invariant (replayed)" replay.out
            shape test "$path::${scenario}_fixed" --seeds 100
          done
